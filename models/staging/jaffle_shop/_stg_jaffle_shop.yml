models:
  - name: stg_jaffle_shop__customers
    description: Clean staging model for jaffle_shop customers with renamed primary key fields for downstream use.
    columns:
      - name: customer_id
        description: Primary key for each customer record.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as provided in the source system.
      - name: last_name
        description: Customer's last name as provided in the source system.
  - name: stg_jaffle_shop__orders
    description: Clean staging model for jaffle_shop orders with standardized key and status column names.
    columns:
      - name: order_id
        description: Primary key for each order record.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'return_pending', 'returned', 'shipped', 'completed']
